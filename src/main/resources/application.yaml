spring:
  application:
    name: aavas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atithi_aavas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

jwt:
  cookie-name: jwt
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG


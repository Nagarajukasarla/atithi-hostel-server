name: Start Services / Resume Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECS_CLUSTER: atithi-dev-cluster
  ECS_SERVICE: atithi-dev-service
  RDS_INSTANCE: atithi-dev-postgres
  ALB_NAME: atithi-dev-alb

jobs:
  start-infrastructure:
    name: Start & Link Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Source Code
        uses: actions/checkout@v4

      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          repository: Nagarajukasarla/atithi-hostel-client
          path: frontend-repo

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Authenticated via OIDC as:"
          aws sts get-caller-identity

      - name: 1. Check and Start RDS Database
        run: |
          echo "Checking RDS instance status..."
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          
          echo "Current RDS Database Status: $DB_STATUS"

          if [ "$DB_STATUS" == "stopped" ]; then
            echo "Database is currently stopped. Initiating start..."
            aws rds start-db-instance \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "Waiting for RDS instance to transition to available..."
            aws rds wait db-instance-available \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS Database is now available!"
          elif [ "$DB_STATUS" == "starting" ]; then
            echo "Database is starting up. Waiting for available state..."
            aws rds wait db-instance-available \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS Database is now available!"
          elif [ "$DB_STATUS" == "available" ]; then
            echo "RDS Database is already running and available."
          else
            echo "RDS Database status is: $DB_STATUS. Proceeding..."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: 2. Recreate Missing Backend Infrastructure (NAT / ALB / Route Tables)
        id: tf-backend
        working-directory: ./terraform
        run: |
          echo "=========================================================================="
          echo "Checking and auto-provisioning missing Backend Infrastructure..."
          echo "=========================================================================="
          terraform init -no-color
          terraform apply -auto-approve -no-color
          
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "NEW_ALB_DNS=$ALB_DNS" >> $GITHUB_ENV
          echo "Backend ALB DNS Name: $ALB_DNS"

      - name: 3. Scale Up ECS Service & Stabilize Containers
        run: |
          echo "=========================================================================="
          echo "Scaling up ECS Fargate task (desired-count = 1)..."
          echo "=========================================================================="
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --desired-count 1 \
            --region "${{ env.AWS_REGION }}"

          echo "Waiting for ECS service tasks to stabilize and register to Target Group..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "ECS service is STABLE and running!"

      - name: 4. Re-Link Frontend CloudFront & Security Rules to New ALB
        id: tf-frontend
        working-directory: ./frontend-repo/terraform
        run: |
          echo "=========================================================================="
          echo "Re-linking CloudFront Distribution and ALB Security to New ALB: ${{ env.NEW_ALB_DNS }}"
          echo "=========================================================================="
          terraform init -no-color
          terraform apply -var="cloudfront_enabled=true" -auto-approve -no-color

          CF_DOMAIN=$(terraform output -raw cloudfront_domain_name)
          echo "LIVE_CF_DOMAIN=$CF_DOMAIN" >> $GITHUB_ENV
          echo "CloudFront Frontend Domain: https://$CF_DOMAIN"

      - name: 5. Full End-to-End Health Verification
        run: |
          echo "=========================================================================="
          echo "Running Live End-to-End Connectivity and Security Checks..."
          echo "=========================================================================="
          
          # 1. Frontend Check
          echo "Checking Frontend SPA at https://${{ env.LIVE_CF_DOMAIN }}..."
          FE_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.LIVE_CF_DOMAIN }}" || echo "000")
          echo "Frontend HTTP Status: $FE_HTTP"

          # 2. Spring Boot via CloudFront
          echo "Checking Spring Boot API at https://${{ env.LIVE_CF_DOMAIN }}/actuator/health..."
          for i in {1..12}; do
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://${{ env.LIVE_CF_DOMAIN }}/actuator/health" || true)
            if [ "$API_STATUS" == "200" ]; then
              echo "✓ API Health Check PASSED via CloudFront (HTTP 200)!"
              break
            fi
            echo "Attempt $i/12: Received HTTP $API_STATUS, retrying in 10s..."
            sleep 10
          done

          # 3. Direct ALB Lockdown Verification
          echo "Checking direct ALB security at http://${{ env.NEW_ALB_DNS }}/api/v1/auth/me..."
          ALB_HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.NEW_ALB_DNS }}/api/v1/auth/me" || echo "000")
          echo "Direct ALB Status (Expected 403 Forbidden): $ALB_HTTP"

          echo "=========================================================================="
          echo "🎉 ATITHI FULL STACK IS LIVE AND PROPERLY LINKED!"
          echo "Frontend App : https://${{ env.LIVE_CF_DOMAIN }}"
          echo "Backend API  : https://${{ env.LIVE_CF_DOMAIN }}/actuator/health"
          echo "=========================================================================="

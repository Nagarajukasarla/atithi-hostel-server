name: Stop Services / Pause Infrastructure

on:
  workflow_dispatch:
    inputs:
      stop_level:
        description: 'Select Stop Mode'
        required: true
        default: 'full-teardown'
        type: choice
        options:
          - 'full-teardown'
          - 'pause-and-destroy-nat'
          - 'pause-compute-only'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECS_CLUSTER: atithi-dev-cluster
  ECS_SERVICE: atithi-dev-service
  RDS_INSTANCE: atithi-dev-postgres
  ALB_NAME: atithi-dev-alb

jobs:
  stop-infrastructure:
    name: Stop / Pause Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Authenticated via OIDC as:"
          aws sts get-caller-identity

      - name: Setup Terraform
        if: ${{ github.event.inputs.stop_level != 'pause-compute-only' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: 1. Pause Frontend (Disable CloudFront Distribution)
        if: ${{ github.event.inputs.stop_level == 'full-teardown' }}
        continue-on-error: true
        run: |
          echo "=========================================================================="
          echo "Pausing Frontend CloudFront Distribution via AWS CLI (Traffic stopped)..."
          echo "=========================================================================="
          CF_DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E3IJXZS95HCP8S' }}"
          echo "Target CloudFront Distribution: $CF_DIST_ID"

          CF_CONFIG=$(aws cloudfront get-distribution-config --id "$CF_DIST_ID" 2>/dev/null || true)
          if [ -n "$CF_CONFIG" ]; then
            ETAG=$(aws cloudfront get-distribution-config --id "$CF_DIST_ID" --query "ETag" --output text)
            IS_ENABLED=$(aws cloudfront get-distribution-config --id "$CF_DIST_ID" --query "DistributionConfig.Enabled" --output text)

            if [ "$IS_ENABLED" == "True" ]; then
              echo "Disabling CloudFront distribution ($CF_DIST_ID)..."
              aws cloudfront get-distribution-config --id "$CF_DIST_ID" --query "DistributionConfig" | jq '.Enabled = false' > /tmp/cf_disable.json
              aws cloudfront update-distribution --id "$CF_DIST_ID" --if-match "$ETAG" --distribution-config file:///tmp/cf_disable.json
              echo "Frontend CloudFront distribution successfully paused."
            else
              echo "Frontend CloudFront distribution is already paused / disabled."
            fi
          else
            echo "CloudFront distribution $CF_DIST_ID not found or not accessible."
          fi

      - name: 2. Scale Down ECS Service (Stop Container Tasks)
        run: |
          echo "Stopping ECS tasks by setting desired count to 0..."
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --desired-count 0 \
            --region "${{ env.AWS_REGION }}"
          echo "ECS service scale-down initiated. Container tasks will terminate."

      - name: 3. Stop RDS PostgreSQL Database
        run: |
          echo "Checking RDS instance status..."
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          
          echo "Current RDS Database Status: $DB_STATUS"

          if [ "$DB_STATUS" == "available" ]; then
            echo "Stopping RDS instance '${{ env.RDS_INSTANCE }}'..."
            aws rds stop-db-instance \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS stop command sent successfully. Database is now stopping."
          elif [ "$DB_STATUS" == "stopped" ] || [ "$DB_STATUS" == "stopping" ]; then
            echo "RDS instance is already in '$DB_STATUS' state. No action needed."
          else
            echo "RDS instance status is '$DB_STATUS'. Proceeding..."
          fi

      - name: 4. Destroy Deletable Network Infrastructure (Terraform)
        if: ${{ github.event.inputs.stop_level != 'pause-compute-only' }}
        working-directory: ./terraform
        run: |
          STOP_MODE="${{ github.event.inputs.stop_level }}"
          echo "Selected Stop Mode: $STOP_MODE"
          terraform init -no-color

          if [ "$STOP_MODE" == "full-teardown" ]; then
            echo "=========================================================================="
            echo "Destroying NAT Gateway, EIP, and ALB (Complete Network Teardown)..."
            echo "Saves ~$68/month idle costs! ECR and RDS data are 100% PRESERVED."
            echo "=========================================================================="
            terraform destroy \
              -target="aws_ecs_service.app" \
              -target="aws_lb_listener.http" \
              -target="aws_lb_target_group.app" \
              -target="aws_lb.main" \
              -target="aws_route.private_app_internet" \
              -target="aws_nat_gateway.main" \
              -target="aws_eip.nat" \
              -auto-approve -no-color
            echo "NAT Gateway, ALB, and Target Group destroyed successfully."
          elif [ "$STOP_MODE" == "pause-and-destroy-nat" ]; then
            echo "=========================================================================="
            echo "Destroying NAT Gateway and EIP (keeping ALB intact)..."
            echo "=========================================================================="
            terraform destroy \
              -target="aws_route.private_app_internet" \
              -target="aws_nat_gateway.main" \
              -target="aws_eip.nat" \
              -auto-approve -no-color
            echo "NAT Gateway destroyed successfully."
          fi

      - name: Summary of Stopped Infrastructure
        run: |
          echo "=========================================================================="
          echo "✅ Services have been successfully STOPPED / PAUSED"
          echo "Mode executed: ${{ github.event.inputs.stop_level }}"
          echo "• ECS Tasks: Scaled to 0 (Fargate compute stopped)"
          echo "• RDS Database: Stop initiated (PostgreSQL compute stopped, data 100% safe)"
          if [ "${{ github.event.inputs.stop_level }}" == "full-teardown" ]; then
            echo "• NAT Gateway & ALB: Destroyed (Eliminated ~$68/month in idle network fees)"
            echo "• Frontend CloudFront: Paused (Serving 0 traffic)"
          elif [ "${{ github.event.inputs.stop_level }}" == "pause-and-destroy-nat" ]; then
            echo "• NAT Gateway: Destroyed (Eliminated ~$32/month charge)"
            echo "• ALB: Preserved"
          fi
          echo "• Amazon ECR Docker Images: 100% PRESERVED"
          echo "• PostgreSQL RDS Data: 100% PRESERVED"
          echo "=========================================================================="

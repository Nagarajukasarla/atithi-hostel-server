name: Backend CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'HELP.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: atithi-server
  ECS_CLUSTER: atithi-dev-cluster
  ECS_SERVICE: atithi-dev-service
  RDS_INSTANCE: atithi-dev-postgres
  ALB_NAME: atithi-dev-alb

jobs:
  deploy:
    name: Build, Provision & Deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Debug OIDC Token & Role Configuration
        run: |
          echo "Target AWS Role ARN: ${{ env.AWS_ROLE_ARN }}"
          echo "Target AWS Region: ${{ env.AWS_REGION }}"
          if [ -z "${{ env.AWS_ROLE_ARN }}" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty! Please verify repository variables in GitHub Settings."
            exit 1
          fi
          # Fetch and decode GitHub OIDC token payload to inspect claims
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value' || true)
          if [ -n "$OIDC_TOKEN" ] && [ "$OIDC_TOKEN" != "null" ]; then
            echo "Decoded OIDC Token Claims:"
            echo "$OIDC_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{aud, sub, repository, repository_owner, ref, event_name}' || true
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Successfully authenticated via GitHub OIDC!"
          aws sts get-caller-identity


      - name: Check and Ensure RDS Database Status
        run: |
          echo "Checking RDS instance status..."
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          
          echo "Current RDS Database Status: $DB_STATUS"

          if [ "$DB_STATUS" == "stopped" ]; then
            echo "Database is currently stopped. Initiating start..."
            aws rds start-db-instance \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "Waiting for RDS instance to transition to available..."
            aws rds wait db-instance-available \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS Database is now available!"
          elif [ "$DB_STATUS" == "starting" ]; then
            echo "Database is starting up. Waiting for available state..."
            aws rds wait db-instance-available \
              --db-instance-identifier "${{ env.RDS_INSTANCE }}" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS Database is now available!"
          elif [ "$DB_STATUS" == "available" ]; then
            echo "RDS Database is already running and available."
          else
            echo "RDS Database status is: $DB_STATUS. Proceeding..."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -no-color

      - name: Check Infrastructure State & Auto-Heal
        working-directory: ./terraform
        run: |
          echo "Checking if infrastructure resources (NAT, ALB, ECS) need creation/healing..."
          set +e
          terraform plan -detailed-exitcode -out=tfplan -no-color
          PLAN_EXIT=$?
          set -e

          if [ $PLAN_EXIT -eq 0 ]; then
            echo "Infrastructure is 100% up-to-date. No recreation needed."
          elif [ $PLAN_EXIT -eq 2 ]; then
            echo "Infrastructure changes or missing resources detected. Applying Terraform plan..."
            terraform apply -auto-approve -no-color tfplan
            echo "Infrastructure provisioned successfully."
          else
            echo "Terraform plan encountered an unexpected error (exit code $PLAN_EXIT)."
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker container image for commit $IMAGE_TAG..."
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .

          echo "Pushing Docker image tags to Amazon ECR..."
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "Docker image push complete: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

      - name: Trigger ECS Fargate Rolling Deployment
        run: |
          echo "Triggering ECS rolling update with the newly pushed image..."
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

          echo "Waiting for ECS Fargate service to reach a stable state..."
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "ECS service successfully stabilized!"

      - name: Verify Live Application Health Check via ALB
        run: |
          echo "Retrieving public ALB endpoint..."
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "Public Application Load Balancer DNS: $ALB_DNS"
          echo "Verifying health endpoint at: http://$ALB_DNS/actuator/health"

          # Retry loop: poll the ALB health check up to 10 times (every 10 seconds)
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://$ALB_DNS/actuator/health" || true)
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Health check PASSED! Received HTTP 200 from Spring Boot backend."
              echo "Deployment is LIVE and fully operational at http://$ALB_DNS"
              exit 0
            fi
            echo "Attempt $i/10: Received HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done

          echo "Health check verification timed out after 100 seconds."
          exit 1
